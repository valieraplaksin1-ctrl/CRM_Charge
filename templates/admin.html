<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Администратор - CRM</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .admin-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #444;
            padding-bottom: 10px;
            flex-wrap: wrap;
        }
        .admin-tab-btn {
            padding: 10px 20px;
            background: #333;
            border: none;
            color: #fff;
            cursor: pointer;
            border-radius: 5px;
        }
        .admin-tab-btn.active {
            background: #4CAF50;
        }
        .admin-tab-content {
            display: none;
        }
        .admin-tab-content.active {
            display: block;
        }
        .user-card {
            background: #333;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
            border-left: 4px solid #4CAF50;
        }
        .user-card h3 {
            margin: 0 0 10px 0;
            color: #4CAF50;
        }
        .user-card p {
            margin: 5px 0;
            color: #ccc;
        }
        .user-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .user-actions button {
            padding: 8px 15px;
            font-size: 12px;
        }
        .password-input {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .password-input input {
            flex: 1;
            padding: 8px;
            background: #444;
            border: 1px solid #555;
            color: #fff;
            border-radius: 3px;
            min-width: 150px;
        }
        .stats {
            background: #333;
            padding: 20px;
            border-radius: 5px;
            margin: 10px 0;
            border-left: 4px solid #2196F3;
        }
        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .client-item {
            background: #444;
            padding: 10px;
            margin: 5px 0;
            border-radius: 3px;
            border-left: 3px solid #2196F3;
        }
        .client-item p {
            margin: 3px 0;
            color: #bbb;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
        }
        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: #222;
            padding: 30px;
            border-radius: 10px;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            border: 2px solid #4CAF50;
        }
        .modal-close {
            float: right;
            font-size: 28px;
            cursor: pointer;
            color: #fff;
        }
    </style>
</head>
<body class="dark-theme">
    <div class="container">
        <header class="header">
            <h1>⚙️ Администратор</h1>
            <a href="/logout" class="btn btn-secondary">Выход</a>
        </header>

        <div class="login-card" id="loginForm" style="max-width: 100%;">
            <form id="adminLoginForm">
                <label>Пароль администратора:</label>
                <input type="password" id="adminPassword" required>
                <button type="submit" class="btn btn-primary">Войти</button>
            </form>
        </div>

        <div id="adminPanel" style="display: none;">
            <div class="admin-tabs">
                <button class="admin-tab-btn active" onclick="switchAdminTab('users')">👥 Пользователи</button>
                <button class="admin-tab-btn" onclick="switchAdminTab('stats')">📊 Статистика</button>
            </div>

            <!-- Управление пользователями -->
            <div id="usersTab" class="admin-tab-content active">
                <div class="login-card">
                    <h2>Добавить нового пользователя</h2>
                    <form id="addUserForm">
                        <label>Имя пользователя:</label>
                        <input type="text" id="newUsername" required>
                        <label>Пароль:</label>
                        <input type="password" id="newUserPassword" required>
                        <button type="submit" class="btn btn-primary">Добавить</button>
                    </form>
                </div>

                <h2 style="margin-top: 30px;">Список пользователей</h2>
                <div id="usersList"></div>
            </div>

            <!-- Статистика -->
            <div id="statsTab" class="admin-tab-content">
                <h2>Статистика агентов</h2>
                <div id="statsList"></div>
            </div>
        </div>
    </div>

    <!-- Модальное окно для клиентов -->
    <div id="clientsModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeClientsModal()">&times;</span>
            <h2 id="modalUserName"></h2>
            <div id="modalClientsList"></div>
        </div>
    </div>

    <script>
        let adminPassword = '';
        let users = [];

        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            adminPassword = document.getElementById('adminPassword').value;
            
            try {
                const response = await fetch('/admin', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({action: 'get_users', password: adminPassword})
                });
                
                if (response.ok) {
                    const data = await response.json();
                    users = data.users;
                    document.getElementById('loginForm').style.display = 'none';
                    document.getElementById('adminPanel').style.display = 'block';
                    loadUsers();
                    loadStats();
                } else {
                    alert('Неверный пароль');
                }
            } catch (err) {
                console.error(err);
                alert('Ошибка при входе');
            }
        });

        async function loadUsers() {
            let html = '';
            for (const user of users) {
                html += `
                    <div class="user-card">
                        <h3>${user.username}</h3>
                        <p>ID: ${user.id}</p>
                        <p>🔐 Пароль: <strong>${user.password}</strong> <button class="btn btn-secondary" style="padding: 3px 10px; font-size: 11px;" onclick="copyToClipboard('${user.password}')">📋 Копировать</button></p>
                        <p>📅 Создан: ${new Date(user.created_at).toLocaleString()}</p>
                        <div class="user-actions">
                            <button class="btn btn-secondary" onclick="showPasswordForm(${user.id})">🔑 Сменить пароль</button>
                            <button class="btn btn-primary" onclick="viewUserClients(${user.id}, '${user.username}')">📋 Клиенты</button>
                            <button class="btn btn-danger" onclick="deleteUser(${user.id})">🗑️ Удалить</button>
                        </div>
                        <div id="passForm${user.id}" class="password-input" style="display: none;">
                            <input type="text" id="newPass${user.id}" placeholder="Новый пароль">
                            <button class="btn btn-success" onclick="updatePassword(${user.id})">✅ Сохранить</button>
                            <button class="btn btn-secondary" onclick="showPasswordForm(${user.id})">❌ Отмена</button>
                        </div>
                    </div>
                `;
            }
            document.getElementById('usersList').innerHTML = html || '<p>Нет пользователей</p>';
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text);
            alert('Скопировано!');
        }

        function showPasswordForm(userId) {
            const form = document.getElementById(`passForm${userId}`);
            form.style.display = form.style.display === 'none' ? 'flex' : 'none';
        }

        async function updatePassword(userId) {
            const newPassword = document.getElementById(`newPass${userId}`).value;
            if (!newPassword) {
                alert('Введите новый пароль');
                return;
            }
            
            try {
                const response = await fetch('/admin', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({action: 'update_password', password: adminPassword, user_id: userId, new_password: newPassword})
                });
                
                if (response.ok) {
                    alert('Пароль обновлен');
                    users.find(u => u.id === userId).password = newPassword;
                    loadUsers();
                } else {
                    alert('Ошибка при обновлении пароля');
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function deleteUser(userId) {
            if (!confirm('Удалить пользователя?')) return;
            
            try {
                await fetch('/admin', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({action: 'delete_user', password: adminPassword, user_id: userId})
                });
                users = users.filter(u => u.id !== userId);
                loadUsers();
                alert('Пользователь удален');
            } catch (err) {
                console.error(err);
            }
        }

        async function viewUserClients(userId, userName) {
            try {
                const response = await fetch('/admin', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({action: 'get_user_clients', password: adminPassword, user_id: userId})
                });
                
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('modalUserName').textContent = `Клиенты ${userName} в работе`;
                    
                    let clientsHtml = '';
                    if (data.clients.length === 0) {
                        clientsHtml = '<p>Нет клиентов в работе</p>';
                    } else {
                        data.clients.forEach(client => {
                            clientsHtml += `
                                <div class="client-item">
                                    <p><strong>${client.name}</strong></p>
                                    <p>📞 ${client.phone}</p>
                                    <p>📧 ${client.email}</p>
                                </div>
                            `;
                        });
                    }
                    
                    document.getElementById('modalClientsList').innerHTML = clientsHtml;
                    document.getElementById('clientsModal').classList.add('active');
                }
            } catch (err) {
                console.error(err);
            }
        }

        function closeClientsModal() {
            document.getElementById('clientsModal').classList.remove('active');
        }

        async function loadStats() {
            let html = '';
            for (const user of users) {
                try {
                    const response = await fetch('/admin', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({action: 'get_stats', password: adminPassword, user_id: user.id})
                    });
                    
                    if (response.ok) {
                        const stats = await response.json();
                        const shiftHours = Math.floor(stats.shift_time / 3600);
                        const shiftMinutes = Math.floor((stats.shift_time % 3600) / 60);
                        
                        html += `
                            <div class="user-card">
                                <h3>${user.username}</h3>
                                <div class="stats-row">
                                    <div class="stats">
                                        <p>📞 Прозвонено сегодня:</p>
                                        <h2 style="color: #4CAF50; margin: 10px 0;">${stats.calls}</h2>
                                    </div>
                                    <div class="stats">
                                        <p>⏱️ Время смены:</p>
                                        <h2 style="color: #2196F3; margin: 10px 0;">${shiftHours}ч ${shiftMinutes}м</h2>
                                    </div>
                                </div>
                            </div>
                        `;
                    }
                } catch (err) {
                    console.error(err);
                }
            }
            document.getElementById('statsList').innerHTML = html || '<p>Нет данных</p>';
        }

        document.getElementById('addUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('newUsername').value;
            const password = document.getElementById('newUserPassword').value;
            
            try {
                const response = await fetch('/admin', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({action: 'add_user', password: adminPassword, username, user_password: password})
                });
                
                if (response.ok) {
                    alert('Пользователь добавлен');
                    document.getElementById('addUserForm').reset();
                    // Перезагружаем список
                    const res = await fetch('/admin', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({action: 'get_users', password: adminPassword})
                    });
                    const data = await res.json();
                    users = data.users;
                    loadUsers();
                } else {
                    alert('Ошибка при добавлении пользователя');
                }
            } catch (err) {
                console.error(err);
            }
        });

        function switchAdminTab(tab) {
            document.querySelectorAll('.admin-tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.admin-tab-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(tab + 'Tab').classList.add('active');
            event.target.classList.add('active');
            
            if (tab === 'stats') {
                loadStats();
            }
        }

        // Закрываем модальное окно при клике вне его
        window.onclick = function(event) {
            const modal = document.getElementById('clientsModal');
            if (event.target === modal) {
                modal.classList.remove('active');
            }
        }
    </script>
</body>
</html>
