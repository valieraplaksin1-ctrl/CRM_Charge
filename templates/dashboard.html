<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная - CRM</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="dark-theme">
    <div class="container">
        <header class="header">
            <h1>📊 CRM Для Прозвона</h1>
            <div class="header-right">
                <span id="username" class="username">{{ session.username }}</span>
                <a href="/logout" class="btn btn-secondary">Выход</a>
            </div>
        </header>

        <div class="dashboard">
            <div class="shift-card">
                <h2>⏱️ Рабочая смена</h2>
                <div id="shiftStatus" class="shift-status">
                    <div id="duration" class="duration">00:00:00</div>
                    <button id="shiftBtn" class="btn btn-primary" onclick="toggleShift()">Начать смену</button>
                </div>
            </div>

            <div class="actions-card">
                <h2>🏢 Действия</h2>
                <div class="button-group">
                    <button class="btn btn-large" onclick="goToClients()">👥 Работа с клиентами</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let shiftInterval;
        const shiftActive = {{ 'true' if shift_active else 'false' }};
        let shiftStartTime = null;

        function initializeTimer() {
            const storedStartTime = localStorage.getItem('shiftStartTime');
            
            if (shiftActive) {
                if (storedStartTime) {
                    shiftStartTime = parseInt(storedStartTime);
                } else {
                    const duration = {{ duration }};
                    shiftStartTime = Date.now() - (duration * 1000);
                    localStorage.setItem('shiftStartTime', shiftStartTime);
                }
                
                startTimerInterval();
                document.getElementById('shiftBtn').textContent = 'Закончить смену';
                document.getElementById('shiftBtn').classList.add('btn-danger');
                document.getElementById('shiftBtn').classList.remove('btn-primary');
            } else {
                localStorage.removeItem('shiftStartTime');
                document.getElementById('duration').textContent = '00:00:00';
            }
        }

        function startTimerInterval() {
            if (shiftInterval) clearInterval(shiftInterval);
            updateTimer();
            shiftInterval = setInterval(updateTimer, 1000);
        }

        function updateTimer() {
            if (!shiftStartTime) return;
            
            const elapsed = Math.floor((Date.now() - shiftStartTime) / 1000);
            const hours = Math.floor(elapsed / 3600);
            const minutes = Math.floor((elapsed % 3600) / 60);
            const seconds = elapsed % 60;
            
            document.getElementById('duration').textContent = 
                `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        async function toggleShift() {
            const action = shiftActive ? 'end' : 'start';
            try {
                const response = await fetch('/api/shift', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({action})
                });
                
                if (response.ok) {
                    location.reload();
                }
            } catch (err) {
                alert('Ошибка');
            }
        }

        function goToClients() {
            window.location.href = '/clients';
        }

        initializeTimer();
    </script>
</body>
</html>
