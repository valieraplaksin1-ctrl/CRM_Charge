{% extends "base.html" %}

{% block title %}Вход в CRM{% endblock %}

{% block content %}
<div class="row justify-content-center" style="margin-top: 100px;">
    <div class="col-md-6 col-lg-4">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0">📞 Вход в CRM</h4>
            </div>
            <div class="card-body">
                <p class="text-muted mb-4">Введите ваше имя для начала работы</p>
                
                <form method="POST">
                    <div class="mb-3">
                        <label for="agent_name" class="form-label">Имя агента</label>
                        <input type="text" class="form-control form-control-lg" id="agent_name" name="agent_name" placeholder="Например: Иван" required autofocus>
                        <small class="text-muted">Введите ваше имя или прозвище</small>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-lg w-100">Войти</button>
                </form>
                
                <hr>
                
                <div class="alert alert-info" role="alert">
                    <strong>Подсказка:</strong> Это система для управления базой клиентов и прозвона.
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
