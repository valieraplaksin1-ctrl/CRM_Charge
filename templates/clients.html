<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Клиенты - CRM</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .cooldown-timer {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            z-index: 2000;
            border: 2px solid #ff6b6b;
        }
        .cooldown-timer h3 {
            color: #ff6b6b;
            margin-bottom: 20px;
        }
        .timer-number {
            font-size: 48px;
            font-weight: bold;
            color: #4CAF50;
            margin: 20px 0;
        }
        .quick-actions button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body class="dark-theme">
    <div class="container">
        <header class="header">
            <div>
                <a href="/dashboard" class="btn btn-secondary">← Назад</a>
                <h1>👥 Работа с клиентами</h1>
            </div>
            <a href="/logout" class="btn btn-secondary">Выход</a>
        </header>

        <div class="clients-container">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('calling')">📞 Начать прозвон</button>
                <button class="tab-btn" onclick="switchTab('working')">📋 Клиенты в работе</button>
            </div>

            <!-- Прозвон клиентов -->
            <div id="callingTab" class="tab-content active">
                <div class="client-card">
                    <div id="clientInfo" class="client-info">
                        <h2>Загрузка...</h2>
                    </div>
                    <div id="clientActions" class="client-actions" style="display: none;">
                        <div class="client-details">
                            <p><strong>Имя:</strong> <span id="clientName"></span></p>
                            <p><strong>Телефон:</strong> <span id="clientPhone"></span></p>
                            <p><strong>Email:</strong> <span id="clientEmail"></span></p>
                        </div>
                        <div class="quick-actions">
                            <button class="btn btn-secondary" id="skipBtn" onclick="skipClient()">👎 Не интересно</button>
                            <button class="btn btn-secondary" id="noAnswerBtn" onclick="noAnswerClient()">📵 No Answer</button>
                        </div>
                        <form id="commentForm" style="margin-top: 20px;">
                            <textarea id="commentText" placeholder="Оставьте комментарий..." required></textarea>
                            <button type="submit" class="btn btn-primary">💬 Сохранить комментарий</button>
                        </form>
                        <div id="choiceModal" style="display: none; margin-top: 20px; padding: 20px; background: #333; border-radius: 5px;">
                            <h3>Что дальше?</h3>
                            <div style="display: flex; gap: 10px; margin-top: 15px;">
                                <button class="btn btn-success" onclick="takeClient()">✅ Взять в работу</button>
                                <button class="btn btn-primary" onclick="continueSkip()">➡️ Далее</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Клиенты в работе -->
            <div id="workingTab" class="tab-content" style="display: none;">
                <div id="workingClientsList" class="clients-list"></div>
            </div>
        </div>
    </div>

    <!-- Таймер ожидания 15 секунд -->
    <div id="cooldownTimer" class="cooldown-timer">
        <h3>⏱️ Подождите перед следующим действием</h3>
        <div class="timer-number" id="timerDisplay">15</div>
        <p>Повторное действие через:</p>
    </div>

    <script>
        let currentClient = null;
        let commentSaved = false;
        let lastSkipTime = 0;

        async function loadCurrentClient() {
            try {
                const response = await fetch('/api/clients?action=current');
                if (response.ok) {
                    currentClient = await response.json();
                    document.getElementById('clientName').textContent = currentClient.name;
                    document.getElementById('clientPhone').textContent = currentClient.phone;
                    document.getElementById('clientEmail').textContent = currentClient.email;
                    document.getElementById('clientInfo').style.display = 'none';
                    document.getElementById('clientActions').style.display = 'block';
                    document.getElementById('commentForm').reset();
                    document.getElementById('choiceModal').style.display = 'none';
                    commentSaved = false;
                    updateSkipButtonState();
                } else {
                    document.getElementById('clientInfo').innerHTML = '<h2>❌ Нет доступных клиентов</h2>';
                    document.getElementById('clientActions').style.display = 'none';
                }
            } catch (err) {
                console.error(err);
            }
        }

        function updateSkipButtonState() {
            const now = Date.now();
            const timeSinceLastSkip = now - lastSkipTime;
            const cooldownTime = 15000; // 15 секунд в миллисекундах
            
            if (timeSinceLastSkip < cooldownTime) {
                const remaining = Math.ceil((cooldownTime - timeSinceLastSkip) / 1000);
                document.getElementById('skipBtn').disabled = true;
                document.getElementById('noAnswerBtn').disabled = true;
                showCooldownTimer(remaining);
                
                // Проверяем состояние кнопок каждую секунду
                setTimeout(() => {
                    updateSkipButtonState();
                }, 1000);
            } else {
                document.getElementById('skipBtn').disabled = false;
                document.getElementById('noAnswerBtn').disabled = false;
                document.getElementById('cooldownTimer').style.display = 'none';
            }
        }

        function showCooldownTimer(remaining) {
            document.getElementById('cooldownTimer').style.display = 'block';
            document.getElementById('timerDisplay').textContent = remaining;
        }

        async function skipClient() {
            const now = Date.now();
            const timeSinceLastSkip = now - lastSkipTime;
            
            if (timeSinceLastSkip < 15000) {
                const remaining = Math.ceil((15000 - timeSinceLastSkip) / 1000);
                showCooldownTimer(remaining);
                return;
            }
            
            if (!currentClient) return;
            try {
                await fetch('/api/clients', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({action: 'skip', client_id: currentClient.id})
                });
                
                lastSkipTime = Date.now();
                document.getElementById('skipBtn').disabled = true;
                document.getElementById('noAnswerBtn').disabled = true;
                showCooldownTimer(15);
                
                loadCurrentClient();
            } catch (err) {
                console.error(err);
            }
        }

        async function noAnswerClient() {
            const now = Date.now();
            const timeSinceLastSkip = now - lastSkipTime;
            
            if (timeSinceLastSkip < 15000) {
                const remaining = Math.ceil((15000 - timeSinceLastSkip) / 1000);
                showCooldownTimer(remaining);
                return;
            }
            
            if (!currentClient) return;
            try {
                await fetch('/api/clients', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({action: 'skip', client_id: currentClient.id})
                });
                
                lastSkipTime = Date.now();
                document.getElementById('skipBtn').disabled = true;
                document.getElementById('noAnswerBtn').disabled = true;
                showCooldownTimer(15);
                
                loadCurrentClient();
            } catch (err) {
                console.error(err);
            }
        }

        document.getElementById('commentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentClient) return;
            
            const comment = document.getElementById('commentText').value;
            try {
                await fetch('/api/clients', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({action: 'add_comment', client_id: currentClient.id, comment})
                });
                
                commentSaved = true;
                showChoice();
            } catch (err) {
                alert('Ошибка при сохранении комментария');
            }
        });

        function showChoice() {
            document.getElementById('choiceModal').style.display = 'block';
        }

        async function takeClient() {
            if (!currentClient) return;
            try {
                await fetch('/api/clients', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({action: 'take', client_id: currentClient.id})
                });
                loadCurrentClient();
            } catch (err) {
                console.error(err);
            }
        }

        function continueSkip() {
            loadCurrentClient();
        }

        async function loadWorkingClients() {
            try {
                const response = await fetch('/api/clients?action=working');
                if (response.ok) {
                    const data = await response.json();
                    let html = '';
                    data.clients.forEach(client => {
                        html += `
                            <div class="working-client-item">
                                <div class="client-header">
                                    <h3>${client.name}</h3>
                                    <p>📞 ${client.phone}</p>
                                </div>
                                <button class="btn btn-primary" onclick="openClient(${client.id})">📝 Просмотр и комментарии</button>
                            </div>
                        `;
                    });
                    document.getElementById('workingClientsList').innerHTML = html || '<p>Нет клиентов в работе</p>';
                }
            } catch (err) {
                console.error(err);
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(tab + 'Tab').style.display = 'block';
            event.target.classList.add('active');
            
            if (tab === 'calling') loadCurrentClient();
            else loadWorkingClients();
        }

        function openClient(clientId) {
            window.location.href = `/working-clients?client_id=${clientId}`;
        }

        loadCurrentClient();
    </script>
</body>
</html>
